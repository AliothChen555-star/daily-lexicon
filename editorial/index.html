<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词汇日报 · 校审工作台</title><link rel="stylesheet" href="/editorial.css"><script src="/app.js" type="module"></script></head>
<body><header class="masthead"><div class="topline"><span>词汇日报 / 内容编辑部</span><span>本机工作台</span></div><div class="brand"><h1>词库校审</h1><span>The Lexicon Desk</span></div><p>核对含义，听清发音，让每个词都有依据。</p></header>
<main><section id="summary" aria-label="词库制作进度"><p>正在读取本地词库…</p></section><details id="scope-info" class="scope-panel"><summary>词表范围与来源依据</summary><div id="scope-summary"></div></details><div class="desk"><aside class="index"><h2>词目清单</h2><label for="query">搜索单词或释义</label><input id="query" type="search" placeholder="单词或中文"><label for="scope-filter">词目范围</label><select id="scope-filter"><option value="target">当前目标</option><option value="reference">仅参考与扩展</option><option value="all">全部索引</option></select><label for="status">制作与校审状态</label><select id="status"><option value="">全部词目</option><option value="missing">待制作</option><option value="pending">待校审</option><option value="approved">已通过</option><option value="changes-requested">需修改</option><option value="stale">内容变化，待重审</option></select><p id="result-count" class="quiet" aria-live="polite"></p><div id="entries"></div><div class="paging"><button id="previous">上一页</button><button id="next">下一页</button></div></aside>
<article id="card" aria-label="词卡校审区"><div class="empty"><h2>从一张词卡开始。</h2><p>左侧列出全部候选词与已制作的扩展词。选择词目，核对正文、听取发音，再记录校审结果。</p><p>待制作的词只列为任务，不计入可学习词卡。</p></div></article></div>
<details class="release"><summary>正式版发布检查</summary><p>检查项目全部完成后，才能生成正式发行包。开发包保持可用。</p><div id="gates"></div></details></main><footer>免费开源 · 校审记录保存到项目，学习档案独立保留。</footer><div id="notice" role="status" aria-live="polite"></div></body></html>
